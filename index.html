<style>

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}

a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:20px}

.logo{font:600 1.5rem 'Cormorant Garamond',serif;color:var(--acc);text-decoration:none;cursor:pointer}
.btn{border:1px solid var(--acc);background:var(--acc);color:#fff;padding:12px 22px;border-radius:999px;cursor:pointer;font-weight:500}
.btn.ghost{background:transparent;color:var(--acc)}.btn.sm{padding:7px 14px;font-size:.85rem}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{text-align:center;padding:56px 0 30px}.hero h1{font-size:clamp(2.4rem,8vw,4.6rem);max-width:12em;margin:0 auto 18px}
.hero p{max-width:34em;margin:0 auto 26px;color:var(--mut)}.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:30px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}

details{border-bottom:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:500}

.studio{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:800px){.studio{grid-template-columns:1fr}}

.gift{--p:#fbf3e4;--t:#3a2424;--a:#7a1f3d;--g:#b8923f;--bg1:#f5e6d3;--bg2:#e9c9c0;position:relative;height:100%;min-height:100dvh;overflow:auto;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--t);text-align:center}

.gift[data-th=midnight]{--p:#1c2540;--t:#f0e6cf;--a:#e0c070;--g:#e0c070;--bg1:#0c1226;--bg2:#222a52}

@keyframes fi{from{opacity:0;transform:translateY(10px)}}
.gift h2{font-size:clamp(2rem,6vw,3rem);color:var(--a)}.gift .sub{opacity:.8;max-width:26em}

.env{position:relative;width:200px;height:132px;background:var(--g);border-radius:6px;box-shadow:0 14px 30px #0004;animation:fl 4s ease-in-out infinite alternate}

@keyframes cf{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.paper{background:var(--p);color:var(--t);width:min(640px,100%);padding:34px 28px;border-radius:6px;box-shadow:0 18px 40px #0003;text-align:left;font:1.2rem/1.75 'Cormorant Garamond',Georgia,serif;font-weight:500;animation:fi 1s both}
.paper .gr{font-size:1.5rem;color:var(--a)}.paper p{margin:0 0 1em}.s{transition:opacity .9s,background .3s;border-radius:4px}.s.hid{opacity:0}.s.on{background:color-mix(in srgb,var(--g) 35%,transparent)}
.sig{font:600 2rem Caveat,cursive;color:var(--a);margin-top:14px}
.ctl{position:sticky;bottom:0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;padding:10px;background:color-mix(in srgb,var(--p) 88%,transparent);backdrop-filter:blur(6px);width:100%;font-size:.85rem}
.ctl select,.ctl input{width:auto;padding:4px 6px;background:var(--p);color:var(--t)}.ctl input[type=range]{padding:0;width:80px}
.bar{height:3px;background:#0002;width:100%}.bar i{display:block;height:100%;width:0;background:var(--a);transition:width .4s}
.skip{position:absolute;top:10px;right:12px;z-index:5;font-size:.8rem;padding:6px 12px}
.emo button{font-size:1.6rem;background:none;border:0;cursor:pointer;padding:6px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

<script>
const $=(s,r=document)=>r.querySelector(s);
function el(t,a={},...k){const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='on')for(const[ev,f]of Object.entries(v))e.addEventListener(ev,f);else if(x==='class')e.className=v;else e.setAttribute(x,v)}k.flat(Infinity).forEach(c=>e.append(c&&c.nodeType?c:document.createTextNode(c??'')));return e}
const SAMPLE={occ:'Birthday',to:'Ama',from:'Kofi',title:'Happy Birthday, Ama',greet:'Dearest Ama,',msg:"Today I wanted to pause and tell you what you mean to me. You have been my laughter on hard days and my calm in every storm.\n\nThank you for every late-night call and every honest word. I hope this year gives back to you everything you have given to others.",close:'Made with love, especially for you.',sig:'Kofi',fmt:'letter',th:'gold',prog:true,voice:'',rate:0.92};
const enc=g=>btoa(unescape(encodeURIComponent(JSON.stringify(g)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dec=s=>{try{return JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))))}catch(e){return null}};
const clean=g=>{const S=(v,n)=>String(v??'').slice(0,n);return{occ:S(g.occ,40),to:S(g.to,60),from:S(g.from,60),title:S(g.title,120),greet:S(g.greet,120),msg:S(g.msg,4000),close:S(g.close,200),sig:S(g.sig,60),fmt:['letter','box','birthday'].includes(g.fmt)?g.fmt:'letter',th:['gold','midnight','sage','rose'].includes(g.th)?g.th:'gold',prog:!!g.prog,voice:S(g.voice,200),rate:Math.min(1.4,Math.max(.6,+g.rate||.92))}};
const reduce=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------- Recipient experience ---------- */
function renderGift(root,g,opts={}){
root.innerHTML='';const tts='speechSynthesis'in window;let timers=[],idx=0,speaking=false,paused=false,spans=[],vol=1;
const W=el('div',{class:'gift','data-th':g.th});root.append(W);
const later=(f,ms)=>timers.push(setTimeout(f,ms));
const stage=n=>{timers.forEach(clearTimeout);timers=[];tts&&speechSynthesis.cancel();speaking=false;W.innerHTML='';W.scrollTop=0;n()};
for(let i=0;i<24;i++){const s=el('i',{class:'star'});s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s`;W.append(s)}
function arrive(){stage(()=>{
 const art=g.fmt==='box'?el('div',{class:'box',id:'art'},el('div',{class:'b'}),el('div',{class:'l'})):g.fmt==='birthday'?el('div',{id:'art',style:'font-size:5rem'},'🎂'):el('div',{class:'env',id:'art'},el('div',{class:'flap'}),el('div',{class:'seal'},'♥'));
 const b=el('button',{class:'btn',on:{click:reveal}},'Open Your Gift');
 W.append(el('div',{class:'sc'},el('p',{class:'sub'},'Someone has something special for you.'),art,el('h2',{class:'disp'},'For '+g.to),el('p',{class:'sub'},'From '+g.from),b));b.focus({preventScroll:true})})}
function confetti(){if(reduce())return;const c=['#d9a441','#c2485f','#5b8def','#6bbf8a'];for(let i=0;i<50;i++){const d=el('i',{class:'cf'});d.style.cssText=`left:${Math.random()*100}%;background:${c[i%4]};animation-delay:${Math.random()*.8}s`;W.append(d);setTimeout(()=>d.remove(),4500)}}
function reveal(){const art=$('#art',W);art&&art.classList.add('open');if(g.fmt==='birthday')confetti();
 const sk=el('button',{class:'btn ghost sm skip',on:{click:letter}},'Skip animation');W.append(sk);later(letter,reduce()?50:1700)}
function letter(){stage(()=>{
 const paras=g.msg.split(/\n{2,}/).filter(x=>x.trim());spans=[];
 const paper=el('div',{class:'paper'},el('div',{class:'gr'},g.greet||('Dear '+g.to+',')));
 if(g.title)paper.insertBefore(el('h2',{class:'disp',style:'margin-bottom:10px'},g.title),paper.firstChild);
 paras.forEach(p=>{const pe=el('p');(p.match(/[^.!?]+[.!?]*\s*/g)||[p]).forEach(t=>{const s=el('span',{class:'s'+(g.prog?' hid':'')},t);spans.push(s);pe.append(s)});paper.append(pe)});
 paper.append(el('div',{class:'sig'},g.sig||g.from));
 const bar=el('div',{class:'bar'},el('i',{id:'pg'}));
 const play=el('button',{class:'btn sm',on:{click:togglePlay}},'▶ Listen'),rp=el('button',{class:'btn ghost sm',on:{click:()=>{idx=0;speak()}}},'↺ Replay'),fin=el('button',{class:'btn ghost sm',on:{click:ending}},'Continue →');
 const rate=el('input',{type:'range',min:.6,max:1.4,step:.1,value:g.rate,'aria-label':'Narration speed',on:{input:e=>g.rate=+e.target.value}});
 const volr=el('input',{type:'range',min:0,max:1,step:.1,value:1,'aria-label':'Volume',on:{input:e=>vol=+e.target.value}});
 const vs=el('select',{'aria-label':'Voice',on:{change:e=>g.voice=e.target.value}});
 const fill=()=>{vs.innerHTML='';speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).forEach(v=>{const o=el('option',{value:v.name},v.name);if(v.name===g.voice)o.selected=true;vs.append(o)})};
 const ctl=el('div',{class:'ctl'},play,rp,tts?['Speed',rate,'Vol',volr,vs]:el('span',{},'Narration isn’t supported on this device — the letter is fully readable.'),fin);
 if(tts){fill();speechSynthesis.onvoiceschanged=fill}else{play.disabled=rp.disabled=true}
 W.append(el('div',{class:'sc',style:'justify-content:flex-start;padding-bottom:0'},paper),bar,ctl);
 const showTo=i=>spans.forEach((s,j)=>{if(j<=i)s.classList.remove('hid')});
 const hl=i=>{spans.forEach((s,j)=>s.classList.toggle('on',j===i));showTo(i);$('#pg',W).style.width=((i+1)/spans.length*100)+'%';spans[i]&&spans[i].scrollIntoView({block:'center',behavior:reduce()?'auto':'smooth'})};
 function speak(){if(!tts)return;speechSynthesis.cancel();speaking=true;paused=false;play.textContent='⏸ Pause';
  const go=i=>{if(!speaking)return;if(i>=spans.length){speaking=false;play.textContent='▶ Listen';idx=0;spans.forEach(s=>s.classList.remove('on'));return}
   idx=i;const u=new SpeechSynthesisUtterance(spans[i].textContent.trim());const v=speechSynthesis.getVoices().find(v=>v.name===g.voice);if(v)u.voice=v;u.rate=g.rate;u.volume=vol;u.pitch=1;
   u.onstart=()=>hl(i);u.onend=()=>go(i+1);u.onerror=e=>{if(e.error!=='canceled'&&e.error!=='interrupted'){speaking=false;play.textContent='▶ Listen'}};speechSynthesis.speak(u)};go(idx)}
 function togglePlay(){if(speaking){speechSynthesis.cancel();speaking=false;paused=true;play.textContent='▶ Resume'}else speak()}
 if(g.prog){let i=0;const step=()=>{if(speaking)return;if(i<spans.length){showTo(i++);later(step,1100)}};later(step,600)}
 })}
function ending(){stage(()=>{const emo=el('div',{class:'emo'});['❤️','😭','🙏','🎉'].forEach(e=>emo.append(el('button',{'aria-label':'React '+e,on:{click:ev=>{emo.append(el('p',{class:'sub'},'Reaction sent to '+g.from+' ✓ (demo: not stored)'));emo.querySelectorAll('button').forEach(b=>b.disabled=true)}}},e)));
 W.append(el('div',{class:'sc'},el('h2',{class:'disp'},g.close||'Made with love, especially for you.'),el('div',{class:'sig'},'— '+(g.sig||g.from)),emo,el('div',{class:'row'},el('button',{class:'btn',on:{click:arrive}},'Replay the gift'),opts.preview?'':el('a',{class:'btn ghost',href:'#/',style:'text-decoration:none'},'Create your own'))));confetti()})}
arrive();return()=>{timers.forEach(clearTimeout);tts&&speechSynthesis.cancel()}}


const TONES={
love:{
'Birthday':[`Happy birthday, my love. Today the world celebrates the day you were born, and I celebrate everything you are.\n\nThank you for your patience, your laughter and the way you make ordinary days feel special. I hope this year brings you all the joy you give so freely.\n\nI'm so lucky to be yours.`,'Forever celebrating you.'],
'Anniversary':[`Another year with you, and I would choose you all over again.\n\nThrough every season we've grown, laughed and learned to love each other better. Thank you for staying, for trying, and for being my home.\n\nHere's to many more years together.`,'Yours, today and always.'],
'Monthly anniversary':[`Another month of us, and my heart is just as full as the first day.\n\nI'm grateful for every message, every laugh and every little moment we shared this month. Time with you always feels too short.\n\nThank you for being you.`,`Here's to every month with you.`],
'Good morning':[`Good morning, my love. Before the day gets busy, I wanted you to know you were the first thing on my mind.\n\nI hope you slept well and that today is gentle with you. Drink some water, eat something good, and remember I'm cheering for you.\n\nTalk soon.`,'Have a beautiful day.'],
'Checking in':[`I just wanted to check on you. How are you really doing today?\n\nIf it's been a heavy day, I'm here. If it's been a good one, I want to hear every detail. Either way, you don't have to carry anything alone.\n\nI love you.`,'Always on your side.'],
'Missing you':[`I miss you, and I wanted you to know it.\n\nDistance and busy schedules can't change how close you are to my heart. I'm counting down to the next time I see you.\n\nUntil then, hold on to this.`,'Thinking of you always.'],
'Sorry':[`I'm sorry. I've been thinking about what happened, and I want to take responsibility for how I hurt you.\n\nYou deserve honesty and care, and I'm committed to doing better. I'm ready to listen whenever you are.\n\nThank you for being patient with me.`,'With love and a sincere apology.'],
'Just because':[`No special reason. I just wanted you to know how much you mean to me.\n\nYou make my life brighter in a thousand small ways. I'm grateful for you today and every day.`,'Just because I love you.']},
family:{
'Birthday':[`Happy birthday! Today is all about you.\n\nThank you for everything you've done for me, big and small. Your love and support have shaped who I am. I hope this year brings you good health, peace and plenty of reasons to smile.\n\nI love you more than words can say.`,'Celebrating you today and always.'],
'Checking in':[`I'm just checking in to see how you're doing.\n\nI know life gets busy, but you're always in my thoughts. I hope you're taking care of yourself, eating well and getting rest. If you need anything at all, just call me.\n\nI love you.`,'Always here for you.'],
'Good morning':[`Good morning! I hope you slept well and that today is kind to you.\n\nI wanted to start my day by thinking of you and sending my love. Take it easy, and take care of yourself.`,'Have a blessed day.'],

'Birthday':[`Happy birthday! Another year older, and somehow still the best company I know.\n\nThank you for the laughs, the honest advice and for showing up when it counts. I hope this year is full of adventure, good food and everything you've been wishing for.\n\nLet's celebrate soon!`,'Cheers to you!'],
'Checking in':[`Just checking in. How have you been?\n\nWe all get busy, but I never stop caring. If you want to talk, vent or just laugh about nothing, I'm a message away.\n\nHope you're doing well.`,'Your friend, always.'],
'Thank you':[`Thank you for being such a good friend.\n\nYou've supported me in ways you may not even realise, and I'm so grateful. Friends like you are rare.\n\nI appreciate you.`,'With heartfelt thanks.'],

const TITLES={'Birthday':'Happy Birthday, {to}','Anniversary':'Happy Anniversary','Monthly anniversary':'Happy Monthiversary','Good morning':'Good Morning, {to}','Checking in':'Thinking of You','Missing you':'I Miss You','Sorry':'I’m Sorry','Just because':'Just Because','Thank you':'Thank You','Congratulations':'Congratulations!','Encouragement':'You’ve Got This','Proud of you':'So Proud of You'};
const GREET={love:'My dearest {to},',family:'Dear {to},',kid:'Dear {to},',friend:'Hey {to},'};
const RELS=[['Girlfriend','love'],['Boyfriend','love'],['Wife','love'],['Husband','love'],['Mom','family'],['Dad','family'],['Brother','family'],['Sister','family'],['Sibling','family'],['Grandparent','family'],['Aunt or Uncle','family'],['Cousin','family'],['Nephew','kid'],['Niece','kid'],['Son','kid'],['Daughter','kid'],['Friend','friend'],['Best friend','friend'],['Colleague','friend'],['Teacher','friend']];
let PRE=null;
const PAY={link:'https://paystack.shop/pay/4xsu8lomgm',amount:'GHS 20'}; /* paste your Paystack payment page link into link */
const tpl=(tone,sc,to,from)=>{const r=x=>x.replace(/\{to\}/g,to||'[Name]').replace(/\{from\}/g,from||'[Your name]'),t=TONES[tone][sc];return{title:r(TITLES[sc]),greet:r(GREET[tone]),msg:r(t[0]),close:r(t[1])}};
